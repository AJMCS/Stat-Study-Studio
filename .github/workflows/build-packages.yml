# Builds the downloads for Windows, Mac (Apple chips and Intel) and Linux, and smoke-tests each one.
# Run it from the Actions tab, or push a tag like v0.1.0 to also publish them on the repo's Releases page.
name: Build packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: npm ci
        working-directory: app
      - run: python -m pip install -r backend/requirements.txt pyinstaller
      - run: python packaging/build.py
      - run: python packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: StatsStudio-${{ matrix.os }}
          path: |
            packaging/dist/StatsStudio-*.zip
            packaging/dist/StatsStudio-*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
