# Builds the double-click Windows download. Run it from the Actions tab, or push a tag like v0.1.0.
name: Build Windows package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: python -m pip install -r backend/requirements.txt pyinstaller
      - run: python packaging/build_windows.py
      - run: packaging/dist/StatsStudio/StatsStudio.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: StatsStudio-windows
          path: packaging/dist/StatsStudio-windows.zip
